name: Mesai
options:
  bundleIdPrefix: com.gokberk
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
settings:
  base:
    DEVELOPMENT_TEAM: 85TTHXUH56
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Mesai:
    type: application
    platform: iOS
    sources: [Mesai]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gokberk.Mesai
        INFOPLIST_KEY_CFBundleDisplayName: "Mesai"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  MesaiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MesaiTests]
    dependencies:
      - target: Mesai
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gokberk.MesaiTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Mesai:
    build:
      targets:
        Mesai: all
    test:
      targets: [MesaiTests]
